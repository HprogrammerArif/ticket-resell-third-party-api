name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # IMAGE_PREFIX is computed per-job: container registry names must be
  # lowercase, and github.repository_owner preserves the account's casing
  # ("HprogrammerArif"), which buildx rejects as an invalid tag.

jobs:
  test:
    name: Run Server Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma Client
        working-directory: server
        run: npx prisma generate

      - name: Compile TypeScript
        working-directory: server
        run: npm run build

      - name: Run Vitest Suite
        working-directory: server
        run: npm test

  build:
    name: Build & Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compute lowercase image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ticketlove" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Express API image
        uses: docker/build-push-action@v7
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Next.js Web image
        uses: docker/build-push-action@v7
        with:
          context: ./client
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-web:latest
          # No fallback defaults: a missing secret must fail the build loudly
          # rather than silently baking a wrong websiteConfigId into production.
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_MAPWIDGET_WEBSITE_CONFIG_ID=${{ secrets.NEXT_PUBLIC_MAPWIDGET_WEBSITE_CONFIG_ID }}
            NEXT_PUBLIC_MAPWIDGET_ENV=${{ vars.MAPWIDGET_ENV }}
          secrets: |
            jwt_secret=${{ secrets.JWT_SECRET }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production VPS
    needs: build
    runs-on: ubuntu-latest
    # The VPS does not exist yet (Phase A). Until it does, test+build still run
    # on every push while this job is skipped instead of failing the workflow.
    # Enable by setting repository variable DEPLOY_ENABLED=true
    # (Settings -> Secrets and variables -> Actions -> Variables).
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Execute SSH remote deployment
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/ticketlove
            TAG="${{ github.sha }}" docker compose pull
            TAG="${{ github.sha }}" docker compose up -d --remove-orphans
            docker image prune -f
